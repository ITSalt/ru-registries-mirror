# Запасной прогон, когда VPS с российским выходом недоступен.
#
# Раннеры GitHub находятся за пределами РФ, поэтому reestrs.minjust.gov.ru
# отсюда не снять — обновляются только глобально доступные реестры. Реестр
# иноагентов и перечень нежелательных сохранят в манифесте прежние данные и
# свою дату съёма, то есть честно продолжат стареть.
#
# Расписания нет намеренно: основной писатель — VPS, а два писателя в один
# репозиторий дают гонку и конфликты.
name: Обновление глобально доступных реестров

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скилл с парсерами
        uses: actions/checkout@v4
        with:
          repository: ITSalt/PepperSkills
          path: .skill

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Снять реестры
        run: |
          python update.py \
            --skill-path .skill/pepper-ru-web-compliance/anthropic \
            --only minjust_extremist_orgs \
            --only fsb_terrorist_orgs \
            --only minjust_extremist_materials

      - name: Опубликовать изменения
        run: |
          if [[ -n "$(git status --porcelain data index.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data index.json
            git commit -m "data: обновление реестров (Actions, частично) $(date -u +%Y-%m-%d)"
            git push
          else
            echo "изменений нет"
          fi
